# Example configuration for containerd-blockoverlayfs-grpc.
# Install as /etc/containerd-blockoverlayfs-grpc/config.toml. Flags given on the command line override these values.

# Keep root on the filesystem that holds containerd's data, and export the same path from containerd's
# proxy_plugins entry: CRI reports it to kubelet as the image filesystem.
root = "/var/lib/containerd/io.containerd.snapshotter.v1.blockoverlayfs"
address = "/run/containerd-blockoverlayfs-grpc/containerd-blockoverlayfs-grpc.sock"
log_level = "info"

[containerd]
# Used to read the record of the container that owns a snapshot: its CRI labels (kind, pod, container name) and
# the scitix.ai/ephemeral-storage annotation of its OCI spec, which carries the container's ephemeral-storage
# request and limit. The platform writes the annotation on the Pod, and containerd's pod_annotations setting
# (deploy/containerd/config.toml) copies it into the spec.
address = "/run/containerd/containerd.sock"
lookup_timeout = "3s"

[overlay]
# Same meaning as the options of containerd's built-in overlayfs snapshotter.
sync_remove = false
upperdir_label = false
mount_options = []

[writable_layer]
# "off" keeps every container on a directory upper. "ephemeral-storage" sizes each app container's block file:
#   a positive limit                -> limit - limit_offset
#   otherwise a positive request    -> ceil(request * request_percent / 100)
#   nothing, or a result below 16Mi -> default_size; empty default_size keeps a directory upper
# Sizes are Kubernetes quantities (256Mi, 20Gi), the notation Pod specs use.
source = "ephemeral-storage"
limit_offset = "256Mi"
request_percent = 105
default_size = "20Gi"
