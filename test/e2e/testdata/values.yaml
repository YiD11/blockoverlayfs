# The suite's base values. The suite places the plugin on the node under test itself. There is no ServiceMonitor:
# the cluster may lack its CRD.
serviceMonitor:
  enabled: false
config:
  # A store of the suite's own: the node may hold the layers of another deployment.
  root: /var/lib/containerd/blockoverlayfs-e2e
  # Only the suite's own Pods get block layers, so whatever a group of specs leaves in the store is its own.
  podSelector:
    matchLabels:
      blockoverlayfs.io/e2e: "true"
  size:
    limitOffset: 256Mi
    defaultSize: 20Gi
