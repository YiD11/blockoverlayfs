apiVersion: v1
kind: Pod
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
  labels:
    app: {{ .Name }}
  {{- with .Storage }}
  annotations:
    blockoverlayfs.io/ephemeral-storage: {{ json . }}
  {{- end }}
spec:
  nodeName: {{ .Node }}
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: {{ .Image }}
      imagePullPolicy: IfNotPresent
      command: ["sleep", "36000"]
