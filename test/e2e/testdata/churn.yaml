apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn
  namespace: {{ .Namespace }}
spec:
  replicas: 0
  selector:
    matchLabels:
      app: churn
  template:
    metadata:
      labels:
        app: churn
        blockoverlayfs.io/e2e: "true"
      annotations:
        blockoverlayfs.io/ephemeral-storage: '{"c":{"limit":"600Mi"}}'
    spec:
      nodeName: {{ .Node }}
      terminationGracePeriodSeconds: 1
      containers:
        - name: c
          image: {{ .Image }}
          imagePullPolicy: IfNotPresent
          command: ["sleep", "36000"]
