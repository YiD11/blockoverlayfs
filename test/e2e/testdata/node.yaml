# The Pod through which the suite reads and acts on the node. It lacks the label the base values select Pods by,
# so it has no block layer of its own.
apiVersion: v1
kind: Pod
metadata:
  name: node
  namespace: {{ .Namespace }}
spec:
  nodeName: {{ .Node }}
  hostPID: true
  hostNetwork: true
  terminationGracePeriodSeconds: 1
  containers:
    - name: node
      image: {{ .Image }}
      imagePullPolicy: IfNotPresent
      command: ["sleep", "86400"]
      securityContext:
        privileged: true
      volumeMounts:
        # For the helper NRI plugin, which runs in this container.
        - name: nri
          mountPath: /var/run/nri
  volumes:
    - name: nri
      hostPath:
        path: /var/run/nri
        type: Directory
