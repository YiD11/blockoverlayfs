apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/name: blockoverlayfs
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  {{- with .Values.config }}
  config.toml: |
    log_level = {{ .logLevel | quote }}
    root = {{ .root | quote }}
    included_namespaces = {{ .includedNamespaces | default list | toJson }}
    excluded_namespaces = {{ .excludedNamespaces | default list | toJson }}

    [nri]
    socket_path = {{ .nri.socketPath | quote }}
    plugin_index = {{ .nri.pluginIndex | quote }}

    [containerd]
    address = {{ .containerd.address | quote }}
    namespace = {{ .containerd.namespace | quote }}
    snapshotter = {{ .containerd.snapshotter | quote }}
    snapshotter_root = {{ .containerd.snapshotterRoot | quote }}

    [size]
    limit_offset = {{ .size.limitOffset | quote }}
    request_percent = {{ .size.requestPercent | int64 }}
    {{- with .size.defaultSize }}
    default_size = {{ . | quote }}
    {{- end }}
  {{- end }}
