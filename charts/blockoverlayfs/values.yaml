image:
  # Build the image with `make image` and push it to a registry your nodes pull from. It is pulled as
  # <registry>/<name>:<tag>, or <name>:<tag> when registry is empty.
  registry: ""
  name: blockoverlayfs
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The plugin's configuration. Every path is a path on the node: the chart mounts each into the plugin's container
# at the same path, because containerd names snapshots by their paths on the node.
config:
  # trace, debug, info, warn, error, fatal or panic.
  logLevel: info
  # One sparse ext4 image per container with a block writable layer.
  root: /var/lib/containerd/blockoverlayfs
  # false stops the plugin giving new containers block layers. It goes on removing the layers of the containers
  # that have one, as they are removed.
  enabled: true
  # Kubernetes namespaces whose Pods get block layers. Empty means every namespace.
  includedNamespaces: []
  # Kubernetes namespaces whose Pods keep plain overlayfs directories, even if also listed in includedNamespaces.
  excludedNamespaces: []
  # A Kubernetes label selector, with matchLabels and matchExpressions. Pods it does not select keep plain
  # overlayfs directories. Empty selects every Pod.
  podSelector: {}
  # podSelector:
  #   matchExpressions:
  #     - {key: blockoverlayfs.io/skip, operator: NotIn, values: ["true"]}
  nri:
    socketPath: /var/run/nri/nri.sock
    # Orders the plugin among NRI plugins: two digits, lower first.
    pluginIndex: "10"
  containerd:
    address: /run/containerd/containerd.sock
    namespace: k8s.io
    # The snapshotter CRI prepares container rootfs with, and its root directory. Containers whose runtime handler
    # uses another snapshotter keep their writable layer as it is.
    snapshotter: overlayfs
    snapshotterRoot: /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs
  size:
    # Subtracted from a container's limit, leaving room under it for the container's logs and emptyDir volumes.
    limitOffset: "256Mi"
    # Applied to a container's request when it declares no limit. At least 100.
    requestPercent: 105
    # For containers that declare nothing, for example 20Gi. Empty keeps such containers on plain overlayfs
    # directories.
    defaultSize: ""

# containerd's state directory, where its shims mount container rootfs. The plugin has to see those mounts.
containerdStateDir: /run/containerd

metrics:
  # The port on the node where the plugin serves Prometheus metrics, at /metrics: its Pod is on the node's network.
  # Unset serves none.
  port: 9466

# A Service and a Prometheus Operator ServiceMonitor for the metrics. Needs metrics.port and the ServiceMonitor CRD.
serviceMonitor:
  enabled: true
  # The labels the monitoring stack selects ServiceMonitors by.
  labels: {}

podAnnotations:
  # Lets the plugin's own Pod start on nodes where containerd's NRI validator requires the plugin for every
  # container, with this key as its tolerate_missing_plugins_annotation. It does nothing anywhere else.
  blockoverlayfs.io/tolerate-missing-plugin: "true"
podLabels: {}

priorityClassName: system-node-critical

nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64

# Business nodes only: those with scitix.ai/instance-type, other than control-plane and scitix-system nodes.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: scitix.ai/instance-type
              operator: Exists
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
            - key: node-role.kubernetes.io/scitix-system
              operator: DoesNotExist

# The plugin runs on every node it is not kept off by nodeSelector or affinity.
tolerations:
  - operator: Exists

# There is no CPU limit: mkfs.ext4 runs in this container, and a throttled one misses containerd's deadline for
# NRI requests, which leaves the container without a block layer.
resources:
  requests:
    cpu: 50m
    memory: 64Mi

# Leave maxSurge unset. Two plugins on one node would delete the layers the other is attaching.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 10%

# How long the plugin gets to finish the layer it is attaching or removing when its Pod is deleted.
terminationGracePeriodSeconds: 30
